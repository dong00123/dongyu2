services:
  - type: web
    name: dongyu-api
    runtime: node
    plan: free
    buildCommand: npm install && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn yolo_service:app --host 127.0.0.1 --port 9001 & npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Dongyu Travel Agent
      - key: BWAI_MODEL
        value: gpt-5.4-mini
      - key: APIFY_PLACES_ACTOR_ID
        value: compass~crawler-google-places
      - key: TRAVEL_RESEARCH_CACHE_TTL_MS
        value: 900000
      - key: PROVIDER_TIMEOUT_MS
        value: 45000
      - key: YOLO_SERVICE_URL
        value: http://127.0.0.1:9001
      - key: YOLO_MODEL_PATH
        value: yolov8n.pt
