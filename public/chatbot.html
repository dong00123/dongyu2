<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 客服平台 - 东玉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blue: #4080ff;
            --green: #00b578;
            --red: #f53f3f;
            --orange: #ff8a00;
            --bg: #f5f7fb;
            --card: #fff;
            --line: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
        }
        body {
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .app {
            display: grid;
            grid-template-columns: 290px 1fr 340px;
            height: 100vh;
        }
        .sidebar,
        .rightbar {
            background: var(--card);
            border-right: 1px solid var(--line);
            overflow-y: auto;
        }
        .rightbar { border-right: none; border-left: 1px solid var(--line); }
        .brand {
            padding: 22px;
            border-bottom: 1px solid var(--line);
        }
        .brand h1 { font-size: 22px; margin-bottom: 6px; }
        .brand p { color: var(--muted); font-size: 13px; }
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }
        .primary { background: var(--blue); color: #fff; }
        .ghost { background: #eef3ff; color: var(--blue); }
        .danger { background: #fff1f0; color: var(--red); }
        .success { background: #e8fff6; color: var(--green); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .conversation-list { padding: 12px; display: grid; gap: 10px; }
        .conversation-item {
            padding: 12px;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .conversation-item.active { border-color: var(--blue); background: #eef3ff; }
        .conversation-item strong { display: block; margin-bottom: 4px; }
        .conversation-item span { color: var(--muted); font-size: 12px; }
        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .topbar {
            height: 68px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .topbar h2 { font-size: 20px; }
        .tabs { display: flex; gap: 8px; }
        .tab {
            padding: 8px 12px;
            border-radius: 999px;
            background: #f3f4f6;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active { background: var(--blue); color: #fff; }
        .panel { display: none; height: calc(100vh - 68px); overflow: auto; }
        .panel.active { display: block; }
        .chat-panel {
            display: none;
            flex-direction: column;
            height: calc(100vh - 68px);
        }
        .chat-panel.active { display: flex; }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { max-width: 76%; padding: 12px 14px; border-radius: 14px; line-height: 1.7; white-space: pre-wrap; }
        .message.user { align-self: flex-end; background: var(--blue); color: #fff; }
        .message.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
        .message.agent { align-self: flex-start; background: #e8fff6; border: 1px solid #b7f3dc; }
        .input-area {
            background: var(--card);
            border-top: 1px solid var(--line);
            padding: 14px;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 140px 160px 1fr auto;
            gap: 10px;
        }
        input,
        select,
        textarea {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; width: 100%; }
        .right-section { padding: 18px; border-bottom: 1px solid var(--line); }
        .right-section h3 { font-size: 16px; margin-bottom: 12px; }
        .info-grid { display: grid; gap: 10px; }
        .info-item { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
        .info-item strong { color: var(--text); text-align: right; }
        .ticket-list,
        .knowledge-list,
        .log-list { display: grid; gap: 10px; }
        .ticket-card,
        .knowledge-card,
        .stat-card,
        .log-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
        }
        .status { padding: 3px 8px; border-radius: 999px; font-size: 12px; }
        .status.pending { background: #fff7e6; color: var(--orange); }
        .status.processing { background: #eef3ff; color: var(--blue); }
        .status.solved { background: #e8fff6; color: var(--green); }
        .status.closed { background: #f3f4f6; color: var(--muted); }
        .admin-page { padding: 20px; display: grid; gap: 18px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-grid { display: grid; gap: 10px; margin-bottom: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .stat-card b { font-size: 26px; display: block; color: var(--blue); }
        .muted { color: var(--muted); font-size: 13px; }
        .home-link { color: var(--blue); text-decoration: none; font-weight: 600; }
        @media (max-width: 1100px) {
            .app { grid-template-columns: 240px 1fr; }
            .rightbar { display: none; }
            .input-grid { grid-template-columns: 1fr; }
            .admin-grid, .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <h1>AI 客服平台</h1>
            <p>会话记忆 · 工单流转 · 知识库管理</p>
            <p><a class="home-link" href="index.html">← 返回首页</a></p>
        </div>
        <div class="toolbar">
            <button class="primary" id="newConversationBtn">新会话</button>
            <button class="ghost" id="refreshConversationBtn">刷新</button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2 id="pageTitle">会话工作台</h2>
            <div class="tabs">
                <div class="tab active" data-panel="chatPanel">客服会话</div>
                <div class="tab" data-panel="adminPanel">后台管理</div>
                <div class="tab" data-panel="statsPanel">统计看板</div>
            </div>
        </div>

        <section class="chat-panel active" id="chatPanel">
            <div class="chat-box" id="chatBox">
                <div class="message assistant">你好，我是东玉 AI 客服。请告诉我你的问题，我会识别身份、分类会话，并在无法回答时自动转人工工单。</div>
            </div>
            <div class="input-area">
                <div class="input-grid">
                    <input id="userNameInput" placeholder="用户名称" value="访客用户">
                    <input id="userIdentityInput" placeholder="身份，如会员/访客" value="网页访客">
                    <input id="messageInput" placeholder="请输入售前、售后、退款、投诉或咨询问题">
                    <button class="primary" id="sendBtn">发送</button>
                </div>
            </div>
        </section>

        <section class="panel" id="adminPanel">
            <div class="admin-page">
                <div class="admin-grid">
                    <div class="ticket-card">
                        <h3>知识库管理</h3>
                        <div class="form-grid">
                            <input id="knowledgeQuestion" placeholder="知识问题">
                            <textarea id="knowledgeAnswer" placeholder="知识答案"></textarea>
                            <select id="knowledgeStatus">
                                <option value="已审核">已审核</option>
                                <option value="待审核">待审核</option>
                            </select>
                            <button class="primary" id="addKnowledgeBtn">新增知识</button>
                        </div>
                        <div class="knowledge-list" id="knowledgeList"></div>
                    </div>
                    <div class="ticket-card">
                        <h3>工单管理</h3>
                        <div class="ticket-list" id="ticketList"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel" id="statsPanel">
            <div class="admin-page">
                <div class="stats-grid">
                    <div class="stat-card"><span>总会话</span><b id="totalConversations">0</b></div>
                    <div class="stat-card"><span>待处理工单</span><b id="openTickets">0</b></div>
                    <div class="stat-card"><span>已解决工单</span><b id="solvedTickets">0</b></div>
                    <div class="stat-card"><span>平均响应</span><b id="avgResponseTime">—</b></div>
                </div>
                <div class="admin-grid">
                    <div class="ticket-card"><h3>热门问题</h3><div id="hotQuestionList"></div></div>
                    <div class="ticket-card"><h3>未解决问题</h3><div id="unresolvedList"></div></div>
                </div>
                <div class="ticket-card"><h3>处理日志</h3><div class="log-list" id="logList"></div></div>
            </div>
        </section>
    </main>

    <aside class="rightbar">
        <div class="right-section">
            <h3>用户信息</h3>
            <div class="info-grid">
                <div class="info-item"><span>用户名称</span><strong id="infoUserName">访客用户</strong></div>
                <div class="info-item"><span>用户身份</span><strong id="infoUserIdentity">网页访客</strong></div>
                <div class="info-item"><span>会话分类</span><strong id="infoCategory">咨询</strong></div>
                <div class="info-item"><span>会话状态</span><strong id="infoStatus">进行中</strong></div>
            </div>
        </div>
        <div class="right-section">
            <h3>工单状态</h3>
            <div id="currentTicketBox" class="muted">当前暂无关联工单。</div>
        </div>
        <div class="right-section">
            <h3>人工回复入口</h3>
            <textarea id="agentReplyInput" placeholder="人工客服回复内容"></textarea>
            <div style="height:10px"></div>
            <button class="success" id="agentReplyBtn">发送人工回复</button>
        </div>
        <div class="right-section">
            <h3>满意度评价</h3>
            <div class="toolbar" style="padding:0;border:0;">
                <button class="ghost satisfaction" data-score="5">满意</button>
                <button class="ghost satisfaction" data-score="3">一般</button>
                <button class="danger satisfaction" data-score="1">不满意</button>
            </div>
        </div>
    </aside>
</div>

<script>
    const conversationList = document.getElementById('conversationList');
    const chatBox = document.getElementById('chatBox');
    const userNameInput = document.getElementById('userNameInput');
    const userIdentityInput = document.getElementById('userIdentityInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentTicketBox = document.getElementById('currentTicketBox');
    const agentReplyInput = document.getElementById('agentReplyInput');
    const agentReplyBtn = document.getElementById('agentReplyBtn');
    const knowledgeList = document.getElementById('knowledgeList');
    const ticketList = document.getElementById('ticketList');
    let activeConversationId = '';
    let activeTicketId = '';

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchPanel(tab.dataset.panel, tab));
    });
    document.getElementById('newConversationBtn').addEventListener('click', newConversation);
    document.getElementById('refreshConversationBtn').addEventListener('click', loadConversations);
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') sendMessage();
    });
    agentReplyBtn.addEventListener('click', sendAgentReply);
    document.getElementById('addKnowledgeBtn').addEventListener('click', addKnowledge);
    document.querySelectorAll('.satisfaction').forEach(button => {
        button.addEventListener('click', () => submitSatisfaction(button.dataset.score));
    });

    function switchPanel(panelId, activeTab) {
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        document.querySelectorAll('.panel, .chat-panel').forEach(item => item.classList.remove('active'));
        activeTab.classList.add('active');
        document.getElementById(panelId).classList.add('active');
        if (panelId === 'adminPanel') loadAdminData();
        if (panelId === 'statsPanel') loadStats();
    }

    function newConversation() {
        activeConversationId = '';
        activeTicketId = '';
        chatBox.innerHTML = '<div class="message assistant">已开启新会话，请输入用户问题。</div>';
        updateUserInfo({ userName: userNameInput.value, userIdentity: userIdentityInput.value, category: '咨询', status: '进行中' });
        currentTicketBox.innerHTML = '当前暂无关联工单。';
    }

    function appendMessage(type, content) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = content;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function parseJson(response) {
        const text = await response.text();
        if (!text) return {};
        try { return JSON.parse(text); } catch { throw new Error('服务返回异常'); }
    }

    async function sendMessage() {
        const content = messageInput.value.trim();
        if (!content) return;
        appendMessage('user', content);
        messageInput.value = '';
        sendBtn.disabled = true;
        try {
            const response = await fetch('/api/customer/reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    conversationId: activeConversationId,
                    userName: userNameInput.value || '访客用户',
                    userIdentity: userIdentityInput.value || '网页访客',
                    content
                })
            });
            const data = await parseJson(response);
            if (!response.ok) throw new Error(data.error || '回复失败');
            activeConversationId = data.conversationId;
            activeTicketId = data.ticketId || activeTicketId;
            appendMessage('assistant', data.answer || '暂无回复');
            updateUserInfo({ userName: userNameInput.value, userIdentity: userIdentityInput.value, category: data.category, status: activeTicketId ? '已转工单' : '进行中' });
            renderCurrentTicket(data.ticketId);
            await loadConversations();
        } catch (error) {
            appendMessage('assistant', error.message || '客服服务暂时不可用');
        } finally {
            sendBtn.disabled = false;
        }
    }

    function updateUserInfo(info) {
        document.getElementById('infoUserName').innerText = info.userName || '访客用户';
        document.getElementById('infoUserIdentity').innerText = info.userIdentity || '网页访客';
        document.getElementById('infoCategory').innerText = info.category || '咨询';
        document.getElementById('infoStatus').innerText = info.status || '进行中';
    }

    function renderCurrentTicket(ticketId) {
        if (!ticketId) return;
        currentTicketBox.innerHTML = `<div class="ticket-card"><strong>${ticketId}</strong><div class="muted">状态：待处理</div><div class="muted">支持人工客服接入和状态流转</div></div>`;
    }

    async function loadConversations() {
        const response = await fetch('/api/customer/conversations?limit=30');
        const data = await response.json();
        conversationList.innerHTML = (data.items || []).map(item => `
            <div class="conversation-item ${item.id === activeConversationId ? 'active' : ''}" data-id="${item.id}">
                <strong>${item.userName}</strong>
                <span>${item.category} · ${item.status} · ${item.messageCount} 条消息</span>
            </div>
        `).join('') || '<div class="muted">暂无会话记录</div>';
        conversationList.querySelectorAll('.conversation-item').forEach(item => {
            item.addEventListener('click', () => loadConversationDetail(item.dataset.id));
        });
    }

    async function loadConversationDetail(id) {
        const response = await fetch(`/api/customer/conversations/${id}`);
        const data = await response.json();
        activeConversationId = data.id;
        activeTicketId = data.context?.ticketId || '';
        chatBox.innerHTML = '';
        (data.messages || []).forEach(message => appendMessage(message.senderType === 'user' ? 'user' : 'assistant', message.content));
        userNameInput.value = data.userName || '访客用户';
        userIdentityInput.value = data.userIdentity || '网页访客';
        updateUserInfo(data);
        renderCurrentTicket(activeTicketId);
        loadConversations();
    }

    async function sendAgentReply() {
        const content = agentReplyInput.value.trim();
        if (!content) return;
        appendMessage('agent', `人工客服：${content}`);
        agentReplyInput.value = '';
        if (activeTicketId) {
            await fetch(`/api/ticket/${activeTicketId}/replies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ replierName: '人工客服', content })
            });
            await fetch(`/api/ticket/${activeTicketId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: '处理中', assignee: '人工客服' })
            });
            currentTicketBox.innerHTML = `<div class="ticket-card"><strong>${activeTicketId}</strong><div class="muted">状态：处理中</div></div>`;
        }
    }

    async function submitSatisfaction(score) {
        if (!activeConversationId) {
            alert('请先选择或创建会话');
            return;
        }
        await fetch(`/api/customer/conversations/${activeConversationId}/satisfaction`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ score: Number(score) })
        });
        alert('满意度评价已提交');
    }

    async function loadAdminData() {
        const [knowledgeRes, ticketRes] = await Promise.all([
            fetch('/api/knowledge'),
            fetch('/api/ticket')
        ]);
        const knowledgeData = await knowledgeRes.json();
        const ticketData = await ticketRes.json();
        knowledgeList.innerHTML = (knowledgeData.list || []).map(item => `
            <div class="knowledge-card">
                <strong>${item.question}</strong>
                <p class="muted">${item.answer}</p>
                <p class="muted">状态：${item.status} · 版本：${item.version}</p>
            </div>
        `).join('') || '<div class="muted">暂无知识</div>';
        ticketList.innerHTML = (ticketData.list || []).map(item => `
            <div class="ticket-card">
                <strong>${item.title || item.id}</strong>
                <p class="muted">用户：${item.userName} · 分类：${item.category}</p>
                <p>${item.content}</p>
                <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                    <span class="status ${statusClass(item.status)}">${item.status}</span>
                    <button class="ghost" onclick="changeTicketStatus('${item.id}','处理中')">处理中</button>
                    <button class="success" onclick="changeTicketStatus('${item.id}','已解决')">已解决</button>
                    <button class="danger" onclick="changeTicketStatus('${item.id}','已关闭')">已关闭</button>
                </div>
            </div>
        `).join('') || '<div class="muted">暂无工单</div>';
    }

    function statusClass(status) {
        if (status === '待处理') return 'pending';
        if (status === '处理中') return 'processing';
        if (status === '已解决') return 'solved';
        return 'closed';
    }

    async function changeTicketStatus(id, status) {
        await fetch(`/api/ticket/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status, assignee: '人工客服' })
        });
        loadAdminData();
        loadStats();
    }

    async function addKnowledge() {
        const question = document.getElementById('knowledgeQuestion').value.trim();
        const answer = document.getElementById('knowledgeAnswer').value.trim();
        const status = document.getElementById('knowledgeStatus').value;
        if (!question || !answer) {
            alert('请填写问题和答案');
            return;
        }
        await fetch('/api/knowledge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, answer, status })
        });
        document.getElementById('knowledgeQuestion').value = '';
        document.getElementById('knowledgeAnswer').value = '';
        loadAdminData();
    }

    async function loadStats() {
        const [statsRes, logsRes] = await Promise.all([fetch('/api/data'), fetch('/api/log')]);
        const stats = await statsRes.json();
        const logs = await logsRes.json();
        document.getElementById('totalConversations').innerText = stats.totalConversations || 0;
        document.getElementById('openTickets').innerText = stats.openTickets || 0;
        document.getElementById('solvedTickets').innerText = stats.solvedTickets || 0;
        document.getElementById('avgResponseTime').innerText = stats.avgResponseTime || '—';
        document.getElementById('hotQuestionList').innerHTML = (stats.hotQuestions || []).map(item => `<div class="log-card">${item.intent || '未分类'}：${item.total} 次</div>`).join('') || '<div class="muted">暂无热门问题</div>';
        document.getElementById('unresolvedList').innerHTML = (stats.unresolvedTickets || []).map(item => `<div class="log-card">${item.title || item.content} · ${item.status}</div>`).join('') || '<div class="muted">暂无未解决问题</div>';
        document.getElementById('logList').innerHTML = (logs.logs || []).map(item => `<div class="log-card">${item.createdAt} · ${item.action} · ${item.detail}</div>`).join('') || '<div class="muted">暂无日志</div>';
    }

    window.changeTicketStatus = changeTicketStatus;
    loadConversations();
    loadAdminData();
    loadStats();
</script>
</body>
</html>
